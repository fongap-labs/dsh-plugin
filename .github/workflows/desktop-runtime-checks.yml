name: Delta Desktop runtime checks

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-runtime-checks.yml'
      - 'packages/dsh-desktop-delta/src-tauri/**'
      - 'packages/dsh-desktop-delta/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tests/desktop-runtime-cleanup.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.28.5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Tauri icons
        run: pnpm --filter @fongap-labs/dsh-desktop-delta icons

      - name: Run desktop Rust tests
        run: pnpm --filter @fongap-labs/dsh-desktop-delta exec cargo test --manifest-path src-tauri/Cargo.toml
