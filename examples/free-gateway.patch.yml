# Apply after the Delta Suite bundle. Replace provider and origin with the deployed route.
# Each config below replaces that row's complete config; merge existing custom values first.
- id: dsh-suite-delta
  config:
    gatewayReliability:
      providers: [gateway]
      origins: [https://gateway.example.com]
      stepBudgetMs: 180000
      auxiliaryBudgetMs: 90000
      maxConcurrent: 1
      maxQueued: 16
      maxClientRetries: 1
      # Enable after verifying the installed adapter supports request-header contributions.
      requireHeaderSupport: false

- id: subagent
  config:
    maxActiveSubagents: 1
    maxDepth: 1

- id: compaction-basic
  config:
    modelPolicies:
      - provider: gateway
        model: Code-Max
        thresholdRatio: 0.2
        retainTokens: 8192
        headroomTokens: 8192
        maxTokens: 8192
        compactionRetries: 0
      - provider: gateway
        model: Code-Ultra
        thresholdRatio: 0.2
        retainTokens: 8192
        headroomTokens: 8192
        maxTokens: 8192
        compactionRetries: 0

- id: tool-result-pruner
  config:
    thresholdChars: 4096
    headChars: 2048
    tailChars: 768
