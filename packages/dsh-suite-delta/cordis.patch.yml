# Route model web_search through the local Python ddgs adapter and keep web_fetch on HTTP.
# Preserve the existing delta-duckduckgo provider id for stored profiles.
# Disable DeepSeek Messages Search and the combined DeepSeek Search/Fetch API package.
- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

- id: web
  config:
    searchProvider: delta-duckduckgo
    fetchProvider: http

# Default the Coding Tools view ("显示代码工作视图" / developerTools) ON.
# The host schema already defaults ui-settings.enabled to true; restating it
# here keeps the suite's intent when a lower layer tries to inherit otherwise.
- id: ui-settings
  config:
    enabled: true

# Default the official-API Session Log upload ("在使用官方模型 API 时上传 Session Log")
# OFF. The host schema defaults enabled to true; the suite opts out by default.
# Users can still re-enable it in Settings → General.
- id: session-log-deepseek
  config:
    enabled: false

# Disable the independent OTel feedback/session channel. Keep the registered
# service in DISABLED mode so feedback callers retain their expected interface.
# This is separate from the official API's dsh_session_log extension above.
- id: session-telemetry-otel
  config:
    mode: DISABLED

# The official DeepSeek adapter otherwise attaches a full active plugin list.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# Desktop product analytics defaults to ON in upstream Harness. Preserve the
# Host-facing service and its version field, but suppress event collection,
# environment probing and user/device identity lookups. The inert OTel reporter
# remains mounted to satisfy required Host service injection.
- id: product-analytics
  config:
    enabled: false
    appVersion: !!js process.env.DSH_CLIENT_VERSION

- insert:
    - id: dsh-suite-delta
      name: '@fongap-labs/dsh-suite-delta'
