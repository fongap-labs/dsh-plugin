# plugin-template Bundle Patch
#
# 复制本目录新建插件后，请同步修改三处：patch 中的 id、name，以及 package.json 的
# name / description / files。id 与 name 必须全局唯一，否则 Loader 会因重复挂载失败。
- insert:
    - id: plugin-template
      name: '@fongap-labs/plugin-template'
      config:
        enabled: true
        # Optional profile overrides: greeting and systemPromptText (no prompt is injected by default).
        # greeting: 'hello'
        # systemPromptText: 'Optional guidance for this plugin'
