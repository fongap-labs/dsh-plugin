# Delta Suite is inert until a user supplies an explicitly authorized provider endpoint.
- insert:
    - id: delta-suite
      name: '@fongap-labs/delta-suite'
      config:
        enabled: true
        modules:
          duckai: true
          chatgpt: true
          customApi: true
          vision: true
          modelDiscovery: true
          capabilityProbe: false
          apiService: true
        discovery:
          refreshOnStart: true
          refreshIntervalMs: 900000
        api:
          enabled: true
          pathPrefix: '/delta-suite/v1'
          exposeExternally: false
        providers: []
        vision:
          allowFallback: false
