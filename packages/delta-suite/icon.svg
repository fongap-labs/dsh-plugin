<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">Delta Suite</title>
  <desc id="desc">The Delta mark in white on a dark circular background</desc>
  <defs>
    <radialGradient id="delta-bg" cx="45%" cy="36%" r="72%">
      <stop offset="0" stop-color="#171B25"/>
      <stop offset="0.7" stop-color="#11151E"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </radialGradient>
    <mask id="delta-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" mask-type="alpha">
      <image
        href="data:image/png;base64,"
        x="10" y="10" width="44" height="44" preserveAspectRatio="none"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#delta-bg)"/>
  <rect width="64" height="64" fill="#FFFFFF" mask="url(#delta-mark)"/>
</svg>
