[package]
name = "dsh-desktop-delta"
version = "0.1.0"
description = "Delta Suite desktop frontend"
authors = ["Fongap Labs"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "dsh_desktop_delta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
